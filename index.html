<script src="data.js"></script>
<script>
const RM={P:3,D:8,C:8,A:6},RB={P:30,D:75,C:105,A:290},KEY="ecsalute_local_v2";
let selected=null,state=load(),homeBestRole="A";

function fresh(){
 let ts={};
 TEAMS.forEach((t,i)=>ts[i]={...t,initialBudget:500,remainingBudget:500,counts:{P:0,D:0,C:0,A:0},spent:{P:0,D:0,C:0,A:0},players:[]});
 return{teams:ts,sales:{},history:[],dynamic:{...RB},transferred:{P:false,D:false,C:false},bonuses:{b50:null,b25:null}};
}
function load(){try{
 let v2=JSON.parse(localStorage.getItem(KEY));
 if(v2){if(!v2.bonuses)v2.bonuses={b50:null,b25:null};return v2}
 let v1=JSON.parse(localStorage.getItem("ecsalute_local_v1"));
 if(v1){if(!v1.bonuses)v1.bonuses={b50:null,b25:null};return v1}
 return fresh()
}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));footer();rivalStrip();renderDashboard();renderBonusButtons()}
function user(){return state.teams[0]}
function slots(t){return Object.keys(RM).reduce((a,r)=>a+RM[r]-t.counts[r],0)}
function maxBid(t,r){if(t.counts[r]>=RM[r])return 0;return Math.max(0,t.remainingBudget-(slots(t)-1))}
function avail(id){return !state.sales[id]}
function norm(s){return(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}

const q=document.getElementById("q"),results=document.getElementById("results"),pa=document.getElementById("pa");
function matches(s){
 s=norm(s).trim();if(!s)return[];
 return PLAYERS.filter(p=>avail(p.id)&&norm(p.name).includes(s))
 .sort((a,b)=>{let x=norm(a.name).startsWith(s)?0:1,y=norm(b.name).startsWith(s)?0:1;return x-y||a.name.localeCompare(b.name,"it")})
 .slice(0,12)
}
function show(){
 let a=matches(q.value);
 if(!q.value){results.style.display="none";return}
 results.innerHTML=a.length?a.map(p=>`<div class="res" data-id="${p.id}"><div><b>${p.name}</b><small>${p.team} · ${p.role}</small></div><span>${p.tier}</span></div>`).join(""):`<div class="res">Nessun giocatore libero</div>`;
 results.style.display="block";
 results.querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>{selected=PLAYERS.find(p=>p.id==e.dataset.id);q.value=selected.name;results.style.display="none";render()})
}
q.oninput=show;q.onfocus=show;
document.getElementById("clr").onclick=()=>{q.value="";selected=null;results.style.display="none";render()}

function displayPresident(t){
 let n=t?.president||"";
 if(n==="Matteo / Gatto") return "Matteo";
 return n;
}
function render(){
 if(!selected){pa.innerHTML='<div class="empty">Cerca un giocatore per iniziare.</div>';return}
 let p=selected;
 const reserve=/^[234]º$/.test(p.tier||"");
 pa.innerHTML=`<div class="playerWorkspace">
   <div class="strategyCard">
     <div class="playerHead"><div class="playerTitle"><b>${p.name}</b><small>${p.team} · ${p.role}</small>
       <div class="badgesInline"><span class="badge role">${p.role}</span><span class="badge tier">${p.tier||"-"}</span></div>
     </div></div>
     <div class="strategyTitle">LA NOSTRA STRATEGIA (REV5)</div>
     <div class="strategyGrid">
       <div class="strategyStat"><label>Titolarità</label><b class="good">${reserve?p.tier:(p.starter||"-")}</b></div>
       <div class="strategyStat"><label>Prezzo obiettivo</label><b>${reserve?"-":(p.target??"-")}</b></div>
       <div class="strategyStat"><label>Stop massimo</label><b class="warn">${reserve?"-":(p.stop??"-")}</b></div>
       <div class="strategyStat"><label>REV5 ADV score</label><b class="good">${reserve?"-":(p.score??"-")}</b></div>
       <div class="strategyStat"><label>Profilo</label><b>${p.profile||"-"}</b></div>
       <div class="strategyStat"><label>Fascia</label><b>${p.tier||"-"}</b></div>
     </div>
     <div class="strategyNote">${p.note||"Nessuna nota strategica aggiuntiva."}</div>
   </div>
   <div class="soldCard">
     <button class="soldBtn" onclick="toggleSold()">SOLD<span class="soldSub">Assegna il giocatore</span></button>
     <div class="assignBox" id="assignBox">
       <label>Squadra acquirente</label>
       <select id="saleTeam" class="assignSelect" onchange="inlineSignal()">
         ${Object.values(state.teams).map((t,i)=>`<option value="${i}">${displayPresident(t)} (${t.remainingBudget} crediti)</option>`).join("")}
       </select>
       <label>Prezzo di aggiudicazione</label>
       <input id="salePrice" class="assignPrice" inputmode="numeric" value="1" oninput="inlineSignal()">
       <div class="assignSignal" id="assignSignal"></div>
       <div class="assignActions">
         <button class="assignCancel" onclick="cancelInlineSale()">ANNULLA</button>
         <button class="assignConfirm" onclick="confirmInlineSale()">CONFERMA</button>
       </div>
     </div>
   </div>
 </div>`;
}
window.toggleSold=()=>{const b=document.getElementById("assignBox");if(!b)return;b.classList.toggle("on");if(b.classList.contains("on"))inlineSignal()}
window.cancelInlineSale=()=>{const b=document.getElementById("assignBox");if(b)b.classList.remove("on")}
window.inlineSignal=()=>{
 if(!selected)return;
 const teamSel=document.getElementById("saleTeam"),priceEl=document.getElementById("salePrice"),sig=document.getElementById("assignSignal");
 if(!teamSel||!priceEl||!sig)return;
 const i=+teamSel.value,t=state.teams[i],v=parseInt(priceEl.value||0),mb=maxBid(t,selected.role);
 if(!v||v<1){sig.textContent="PREZZO NON VALIDO";sig.style.color="#ff6484";return}
 if(v>mb){sig.textContent=`MAX ${mb}`;sig.style.color="#ff6484";return}
 if(selected.stop&&v>selected.stop){sig.textContent="OLTRE STOP";sig.style.color="#ff6484"}
 else if(selected.target&&v>selected.target){sig.textContent="SOPRA OBIETTIVO";sig.style.color="#ffd166"}
 else{sig.textContent=`OK · MAX ${mb}`;sig.style.color="#45e0ae"}
}
window.confirmInlineSale=()=>{
 if(!selected)return;
 const i=+document.getElementById("saleTeam").value,price=parseInt(document.getElementById("salePrice").value||0),p=selected,t=state.teams[i];
 if(!price||price<1){inlineSignal();return}
 if(t.counts[p.role]>=RM[p.role]){alert("SLOT RUOLO COMPLETO");return}
 const mb=maxBid(t,p.role);if(price>mb){inlineSignal();return}
 const before=JSON.parse(JSON.stringify({teams:state.teams,dynamic:state.dynamic,transferred:state.transferred,sales:state.sales}));
 t.remainingBudget-=price;t.counts[p.role]++;t.spent[p.role]+=price;t.players.push({playerId:p.id,price});state.sales[p.id]={teamId:i,price};
 if(i===0&&["P","D","C"].includes(p.role)&&t.counts[p.role]===RM[p.role]&&!state.transferred[p.role]){state.dynamic.A+=RB[p.role]-t.spent[p.role];state.transferred[p.role]=true}
 state.history.push({type:"sale",before});selected=null;q.value="";save();render();window.scrollTo({top:0,behavior:"smooth"})
}

function open(h){sheet.innerHTML=h;back.style.display="flex";sheet.scrollTop=0}
function close(){back.style.display="none";sheet.innerHTML=""}
const back=document.getElementById("back"),sheet=document.getElementById("sheet");
back.onclick=e=>{if(e.target===back)close()}
const fullview=document.getElementById("fullview"),fullTitle=document.getElementById("fullTitle"),fullBody=document.getElementById("fullBody");
let fullScrollY=0;
function openFull(title,html){fullScrollY=window.scrollY;fullTitle.textContent=title;fullBody.innerHTML=html;fullBody.scrollTop=0;fullview.classList.add("on");document.body.classList.add("full-open");document.body.style.top=`-${fullScrollY}px`}
function closeFull(){fullview.classList.remove("on");fullBody.innerHTML="";document.body.classList.remove("full-open");document.body.style.top="";window.scrollTo(0,fullScrollY)}
window.closeFull=closeFull;

window.purchase=i=>{
 let p=selected,t=state.teams[i],m=maxBid(t,p.role);
 open(`<button class="x" onclick="close()">×</button><h2>${i===0?"Lo prendo io":t.name}</h2>
 <div style="color:#b9c0ca;margin-bottom:10px"><b>${p.name}</b> · ${p.team} · ${p.role}<br>${p.tier} · ${p.starter} · OBJ ${p.target} · STOP ${p.stop}<br>MAX OFFERTA ${m}</div>
 <input id="price" class="price" inputmode="numeric" value="1">
 <div class="quick"><button onclick="bump(1)">+1</button><button onclick="bump(2)">+2</button><button onclick="bump(5)">+5</button><button onclick="bump(10)">+10</button></div>
 <div class="signal" id="signal"></div>
 <button class="confirm" onclick="confirmSale(${i})">CONFERMA</button>
 <button class="cancel" onclick="close()">ANNULLA</button>`);
 document.getElementById("price").oninput=signal;signal()
}
window.bump=n=>{let x=document.getElementById("price");x.value=(parseInt(x.value||0)+n);signal()}
function signal(){
 let v=parseInt(document.getElementById("price")?.value||0),s=document.getElementById("signal");if(!s)return;
 if(v<=selected.target){s.textContent="IN OBIETTIVO";s.style.color="#45e0ae"}
 else if(v<=selected.stop){s.textContent="SOPRA OBIETTIVO";s.style.color="#ffd166"}
 else{s.textContent="OLTRE STOP";s.style.color="#ff6484"}
}
window.confirmSale=i=>{
 let p=selected,t=state.teams[i],price=parseInt(document.getElementById("price").value||0);
 if(!price||price<1){signal();return;}
 if(t.counts[p.role]>=RM[p.role])return alert("SLOT RUOLO COMPLETO");
 let mb=maxBid(t,p.role);if(price>mb)return alert("Massimo spendibile: "+mb);
 let before=JSON.parse(JSON.stringify({teams:state.teams,dynamic:state.dynamic,transferred:state.transferred,sales:state.sales}));
 t.remainingBudget-=price;t.counts[p.role]++;t.spent[p.role]+=price;t.players.push({playerId:p.id,price});
 state.sales[p.id]={teamId:i,price};
 if(i===0&&["P","D","C"].includes(p.role)&&t.counts[p.role]===RM[p.role]&&!state.transferred[p.role]){
   state.dynamic.A+=RB[p.role]-t.spent[p.role];state.transferred[p.role]=true
 }
 state.history.push({type:"sale",before});
 selected=null;q.value="";close();save();render()
}

window.other=()=>{
 let h='<button class="x" onclick="close()">×</button><h2>Altra squadra</h2><div class="teamlist">';
 for(let i=1;i<TEAMS.length;i++)h+=`<button onclick="purchase(${i})"><b>${state.teams[i].president}</b><small>${state.teams[i].name} · ${state.teams[i].remainingBudget} cr</small></button>`;
 open(h+'</div>')
}

window.remaining=r=>{
 let a=PLAYERS.filter(p=>p.role===r&&avail(p.id))
 .sort((x,y)=>{
   const tx=/^F(\d)$/.exec(x.tier||""),ty=/^F(\d)$/.exec(y.tier||"");
   const xv=tx?+tx[1]:9,yv=ty?+ty[1]:9;
   return xv-yv||(y.score-x.score)||((x.tierPriority||999)-(y.tierPriority||999))||x.name.localeCompare(y.name,"it")
 }).slice(0,30);
 openFull("★ Migliori rimasti",`<div class="tabs">${["P","D","C","A"].map(x=>`<button class="${x===r?"on":""}" onclick="remaining('${x}')">${x}</button>`).join("")}</div>
 ${a.map((p,i)=>`<div class="lrow" onclick="pickFull(${p.id})"><b>${i+1}</b><div><div class="nm">${p.name}</div><small>${p.team} · ${p.tier||"-"} · ${p.starter||""}</small></div><div class="mini">${/^[234]º$/.test(p.tier||"")?"":`OBJ ${p.target}<br>STOP ${p.stop}`}</div></div>`).join("")}`)
}
window.pickFull=id=>{selected=PLAYERS.find(p=>p.id===id);q.value=selected.name;closeFull();render();scrollTo({top:0,behavior:"smooth"})}
window.pick=id=>{selected=PLAYERS.find(p=>p.id===id);q.value=selected.name;close();render();scrollTo({top:0,behavior:"smooth"})}

function footer(){}

function roleColor(r){return r==="A"?"#df2735":r==="C"?"#0aa86e":r==="D"?"#147cf0":"#8c63ff"}
function renderDashboard(){
 const tabs=document.getElementById("homeBestTabs"),best=document.getElementById("homeBest"),teams=document.getElementById("homeTeams");
 if(!tabs||!best||!teams)return;
 tabs.innerHTML=["P","D","C","A"].map(r=>`<button class="${r===homeBestRole?"on":""}" onclick="setHomeBest('${r}')">${r}</button>`).join("");
 let a=PLAYERS.filter(p=>p.role===homeBestRole&&avail(p.id)).sort((x,y)=>{
   const tx=/^F(\d)$/.exec(x.tier||""),ty=/^F(\d)$/.exec(y.tier||"");const xv=tx?+tx[1]:9,yv=ty?+ty[1]:9;
   return xv-yv||(y.score-x.score)||((x.tierPriority||999)-(y.tierPriority||999))||x.name.localeCompare(y.name,"it")
 }).slice(0,10);
 best.innerHTML=a.map((p,i)=>`<div class="bestItem" onclick="pickHome(${p.id})"><span class="rank">${i+1}</span><b>${p.name}</b><small>${p.team}</small><span class="r" style="background:${roleColor(p.role)}">${p.role}</span></div>`).join("");
 teams.innerHTML=Object.values(state.teams).map((t,i)=>{let m=Math.max(0,t.remainingBudget-Math.max(0,slots(t)-1));return `<div class="teamTile ${i===0?"me":""}" onclick="rivalDetail(${i})"><b>${displayPresident(t)}</b><div class="money">${t.remainingBudget}</div><small>MAX ${m}</small><div class="teamCounts">${["P","D","C","A"].map(r=>`<span>${r}<strong>${t.counts[r]}/${RM[r]}</strong></span>`).join("")}</div></div>`}).join("");
}
window.setHomeBest=r=>{homeBestRole=r;renderDashboard()}
window.pickHome=id=>{selected=PLAYERS.find(p=>p.id===id);q.value=selected.name;render();window.scrollTo({top:document.querySelector(".search").offsetTop-70,behavior:"smooth"})}

function rivalStrip(){const arr=Object.entries(state.teams).filter(([i])=>+i!==0);let high=Math.max(...arr.map(([i,t])=>Math.max(0,t.remainingBudget-Math.max(0,slots(t)-1))));const el=document.getElementById("rivals");el.innerHTML=arr.map(([i,t])=>{let m=Math.max(0,t.remainingBudget-Math.max(0,slots(t)-1));return `<button class="rchip ${m===high?"topmax":""}" onclick="rivalDetail(${i})"><b>${t.president} ${t.remainingBudget}</b><small>MAX ${m}</small></button>`}).join("")}
window.rivalDetail=i=>{let t=state.teams[i],m=Math.max(0,t.remainingBudget-Math.max(0,slots(t)-1));let roster=t.players.map(x=>{let p=PLAYERS.find(z=>z.id===x.playerId);return p?`${p.name} (${p.role}) · ${x.price}`:""}).filter(Boolean);open(`<div class="sheetHead"><button class="x" onclick="close()">×</button><h2>${t.name}</h2></div><div style="color:#9da5b0">${t.president}</div><div class="rivalDetail"><div class="stat"><label>Crediti</label><b>${t.remainingBudget}</b></div><div class="stat"><label>MAX offerta</label><b>${m}</b></div><div class="stat"><label>P</label><b>${t.counts.P}/3</b></div><div class="stat"><label>D</label><b>${t.counts.D}/8</b></div><div class="stat"><label>C</label><b>${t.counts.C}/8</b></div><div class="stat"><label>A</label><b>${t.counts.A}/6</b></div></div><h3>Rosa</h3>${roster.length?roster.map(x=>`<div class="lrow" style="grid-template-columns:1fr"><div>${x}</div></div>`).join(""):'<div style="color:#89919c">Nessun acquisto.</div>'}`)}
window.openBonus=(amount)=>{
 const key=amount===50?"b50":"b25";
 if(state.bonuses&&state.bonuses[key]!==null){
   const t=state.teams[state.bonuses[key]];
   alert(`Bonus +${amount} già assegnato a ${displayPresident(t)}.`);
   return;
 }
 let h=`<div class="sheetHead"><button class="x" onclick="close()">×</button><h2>Assegna +${amount} crediti</h2></div><select id="ct" class="select">`;
 Object.values(state.teams).forEach((t,i)=>h+=`<option value="${i}">${displayPresident(t)} (${t.remainingBudget})</option>`);
 open(h+`</select><button class="confirm" style="margin-top:12px" onclick="applyBonus(${amount})">ASSEGNA +${amount}</button><button class="cancel" onclick="close()">ANNULLA</button>`);
}
window.applyBonus=(amount)=>{
 const key=amount===50?"b50":"b25";
 if(state.bonuses&&state.bonuses[key]!==null)return;
 const i=+ct.value;
 const before={teams:JSON.parse(JSON.stringify(state.teams)),bonuses:JSON.parse(JSON.stringify(state.bonuses||{b50:null,b25:null}))};
 state.teams[i].initialBudget+=amount;
 state.teams[i].remainingBudget+=amount;
 if(!state.bonuses)state.bonuses={b50:null,b25:null};
 state.bonuses[key]=i;
 state.history.push({type:"bonus",before,amount});
 save();close();
}
function renderBonusButtons(){
 const b50=document.getElementById("bonus50btn"),b25=document.getElementById("bonus25btn");
 if(b50)b50.classList.toggle("used",!!(state.bonuses&&state.bonuses.b50!==null));
 if(b25)b25.classList.toggle("used",!!(state.bonuses&&state.bonuses.b25!==null));
}
undo.onclick=()=>{
 let h=state.history.pop();if(!h)return alert("Niente da annullare");
 if(h.type==="sale"){state.teams=h.before.teams;state.dynamic=h.before.dynamic;state.transferred=h.before.transferred;state.sales=h.before.sales}
 else if(h.type==="bonus"){state.teams=h.before.teams;state.bonuses=h.before.bonuses}
 else state.teams=h.before.teams;
 save();render()
}

settings.onclick=()=>open(`<button class="x" onclick="close()">×</button><h2>Impostazioni</h2>
<div class="settings"><button onclick="rosters()">ROSE / CREDITI AVVERSARI</button><button onclick="creditsEdit()">MODIFICA CREDITI SQUADRA</button><button onclick="openBonus(50)">ASSEGNA +50 CREDITI</button><button onclick="openBonus(25)">ASSEGNA +25 CREDITI</button><button onclick="reset()">RESET ASTA</button></div>`)

window.rosters=()=>{
 let h="";
 Object.values(state.teams).forEach((t,i)=>h+=`<div class="lrow" onclick="rosterTeam(${i})"><b>${i+1}</b><div><div class="nm">${t.name}</div><small>${t.president} · ${t.remainingBudget} crediti</small></div><div class="mini">P ${t.counts.P}/3 D ${t.counts.D}/8<br>C ${t.counts.C}/8 A ${t.counts.A}/6</div></div>`);
 openFull("Rose e crediti",h)
}
window.rosterTeam=i=>{closeFull();setTimeout(()=>rivalDetail(i),0)}
window.creditsEdit=()=>{
 let h='<button class="x" onclick="close()">×</button><h2>Modifica crediti</h2><select id="ct" class="select">';
 Object.values(state.teams).forEach((t,i)=>h+=`<option value="${i}">${displayPresident(t)}</option>`);
 open(h+'</select><input id="delta" class="price" style="margin-top:10px" inputmode="numeric" value="50"><button class="confirm" style="margin-top:10px" onclick="applyC()">CONFERMA</button>')
}
window.applyC=()=>{
 let i=+ct.value,d=parseInt(delta.value||0),before={teams:JSON.parse(JSON.stringify(state.teams))};
 state.teams[i].initialBudget+=d;state.teams[i].remainingBudget+=d;state.history.push({type:"credits",before});save();close()
}
window.reset=()=>{if(confirm("Reset completo?")&&confirm("Sei sicuro?")){state=fresh();selected=null;q.value="";save();close();render()}}
window.close=close;window.closeFull=closeFull;footer();rivalStrip();renderDashboard();renderBonusButtons();render();

if("serviceWorker" in navigator){
 addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))
}
</script>
</body>
</html>
